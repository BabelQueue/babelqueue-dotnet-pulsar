name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/BabelQueue.Pulsar/BabelQueue.Pulsar.csproj -c Release -o artifacts

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # The cross-SDK conformance results (ADR-0032) ride along as a release asset.
          files: ${{ runner.temp }}/results.json
